name: Publish package (TestPyPI -> PyPI)

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - release
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Also publish to production PyPI"
        required: true
        default: false
        type: boolean

# Publishing (TestPyPI + PyPI) only ever runs for an actual GitHub Release
# (event_name == 'release') or an explicit manual dispatch. A plain push to
# the `release` branch only runs the build-and-test job, so promoting main
# into release no longer triggers a duplicate publish attempt.

jobs:
  build-and-test:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.44.0

      - name: Run CLI help smoke tests
        run: |
          mkdir -p testing_folder/outputs
          pixi run -e dev pytest -q src/tests/test_cli_help_smoke.py

      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version_file = pyproject["tool"]["hatch"]["version"]["path"]
          version_text = Path(version_file).read_text(encoding="utf-8")
          match = re.search(r"__version__\s*=\s*['\"]([^'\"]+)['\"]", version_text)
          if not match:
              raise SystemExit(f"Could not parse __version__ from {version_file}")

          package_version = match.group(1)
          release_tag = os.environ["GITHUB_REF_NAME"]
          normalized_tag = release_tag[1:] if release_tag.startswith("v") else release_tag
          if normalized_tag != package_version:
              raise SystemExit(
                  f"Release tag ({release_tag}) does not match package version ({package_version})"
              )
          print(f"Version check passed: tag={release_tag}, package={package_version}")
          PY

      - name: Build wheel + sdist
        run: |
          rm -rf dist build
          pixi run -e dev python -m pip install --upgrade build
          pixi run -e dev python -m build --sdist --wheel --outdir dist

      - name: Twine metadata check
        run: pixi run -e dev twine check dist/*

      - name: Verify distributions contain every package module
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          expected = {
              str(path.relative_to("src"))
              for path in Path("src/rolypoly").rglob("*.py")
          }
          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              missing = expected - set(archive.namelist())
              assert not missing, f"Wheel missing modules: {sorted(missing)}"
          sdist = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist) as archive:
              members = {name.split("/", 1)[1] for name in archive.getnames() if "/" in name}
              missing = {f"src/{name}" for name in expected} - members
              assert not missing, f"Sdist missing modules: {sorted(missing)}"
          PY

      - name: Smoke-test installed wheel outside source checkout
        run: |
          smoke_dir=$(mktemp -d)
          pixi run -e dev python -m venv --system-site-packages "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --no-deps --ignore-installed dist/*.whl
          cp src/tests/test_cli_help_smoke.py "$smoke_dir/test_cli_help_smoke.py"
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -I -c 'import sys, rolypoly; from pathlib import Path; assert Path(rolypoly.__file__).is_relative_to(Path(sys.prefix)), rolypoly.__file__'
          "$smoke_dir/venv/bin/python" -I -m pytest -q --confcutdir="$smoke_dir" test_cli_help_smoke.py

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build-and-test
    # Only publish for an actual GitHub Release or an explicit manual dispatch.
    # A push to the release branch (e.g. promoting main) only builds/tests.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/rolypoly-tk
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke-install-testpypi:
    name: Smoke-test install from TestPyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Determine built version
        id: version
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          wheel = next(Path('dist').glob('*.whl')).name
          version = wheel.split('-')[1]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")
          print(f"Built version: {version}")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install from TestPyPI (retry for index lag)
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5 ; do
            echo "Attempt ${attempt}: installing rolypoly_tk==${PKG_VERSION} from TestPyPI"
            if python -m pip install --no-deps --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple "rolypoly_tk==${PKG_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "Failed to install package from TestPyPI after retries"
              exit 1
            fi
            sleep 20
          done

      - name: Verify import + CLI
        run: |
          python -m pip install --index-url https://pypi.org/simple rich-click polars
          python -c "import rolypoly; print(rolypoly.__version__)"
          rolypoly --help >/dev/null
          rolypoly get-data --help >/dev/null

  publish-pypi:
    name: Publish to PyPI
    needs: smoke-install-testpypi
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/rolypoly-tk
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
