[project]
name = "rolypoly_tk"
dynamic = ["version"]
authors = [
    { name = "Uri Neri", email = "uneri@lbl.gov" },
    { name = "Dimitris Karapliafis", email = "dimitris.karapliafis@wur.nl" },
    { name = "Lander De Coninck", email = "lander_email@gmail.com" },
    { name = "Brian Bushnell", email = "bbushnell@lbl.gov" },
    { name = "Frederik Schulz", email = "fschulz@lbl.gov" },
    { name = "Antonio Camargo", email = "antoniop.camargo@lbl.gov" },
    { name = "Andrei Stecca Steindorff", email = "andreiss@jgi.doe.gov" },
    { name = "Clement Coclet", email = "cclement@jgi.doe.gov" },
    { name = "David Parker", email = "dparker@carnegiescience.edu" },
    { name = "Simon Roux", email = "sroux@lbl.gov" },
]

description = "RNA virus analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# License-File = "license"
dependencies = [
    # "lightmotif>=0.10.0,<0.11", # not yet on conda-forge, will be added later. Our use case (rnamotif_tool) is not yet mature.
    "mappy>=2.31,<3",
    "needletail>=0.7.3,<0.8",
    "psutil>=7.2.2,<8",
    "pyfastx>=2.3.1,<3",
    "pyhmmer>=0.12.1,<0.13",
    "requests>=2.34.2,<3",
    "rich-click>=1.9.8,<2",
    "rich>=15.0.0,<16",
    "intervaltree>=3.2.1,<4",
    "polars>=1.43.0,<2",
    "bbmapy>=0.0.57,<0.0.58",
    "xxhash>=3.8.1,<4",
    "pyrodigal-rv>=0.1.0,<0.2",
    "parasail>=1.3.4,<2",
    "pyopal>=0.7.3,<0.8",
    "pydustmasker>=3.2.0,<4",
    "pyarrow>=25.0.0,<26",
    "linearfold>=1.1,<2",
    "viennarna>=2.7.2,<3",
    "numpy>=2.3.0,<3",
]

[project.urls]
Source = "https://github.com/UriNeri/rolypoly"
Documentation = "https://urineri.github.io/rolypoly/"
pypi = "https://pypi.org/project/rolypoly-tk/"

[project.scripts]
rolypoly = "rolypoly.rolypoly:rolypoly"

[dependency-groups]
build = ["hatch>=1.17.1,<2", "pip"]
format = ["ruff>=0.15.22,<0.16"]
publish = ["twine>=7.0.0,<8"]
dev = [
    "aria2p>=0.12.1,<0.13",
    "tqdm>=4.69.0,<5",
    "fsspec>=2026.6.0,<2027",
    "networkx>=3.4.2,<4",
    "matplotlib>=3.10.9,<4",
    "baltic>=0.3.0,<0.4",
    "tskit>=1.0.1,<2",
    "pytest>=9.1.1,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.version]
path = "src/rolypoly/__init__.py"

[tool.hatch.build]
packages = ["src/rolypoly"]

[tool.hatch.build.targets.wheel]
packages = ["src/rolypoly"]
package-dir = { rolypoly_tk = "src/rolypoly" }

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
rolypoly_tk = { path = ".", editable = true }

# Core dependencies needed for base rolypoly functionality
[tool.pixi.dependencies]
pip = ">=26.1.2,<27"

# Feature-based dependencies for modular installation
[tool.pixi.feature.reads.dependencies]
# For reads processing commands (filter-reads, shrink-reads, mask-dna)
seqkit = ">=2.13.0,<3"
bwa-mem2 = ">=2.3,<3"
falco = ">=1.3.1,<2"
pigz = ">=2.8,<3"
mmseqs2 = ">=18.8cc5c,<19"


[tool.pixi.feature.assembly.dependencies]
# For assembly command (assemble, filter-contigs)  
spades = ">=4.3.0,<5"
megahit = ">=1.2.9,<2"
plass = ">=5.cf8933,<6"
mmseqs2 = ">=18.8cc5c,<19"

[tool.pixi.feature.annotation-rna.dependencies]
# For RNA annotation commands (annotate-rna)
infernal = ">=1.1.5,<2"
linearfold = ">=1.0.1.dev20220829,<2"
aragorn = ">=1.2.41,<2"
trnascan-se = ">=2.0.13,<3"

[tool.pixi.feature.annotation-prot.dependencies]
# For protein annotation commands (annotate-prot)
mmseqs2 = ">=18.8cc5c,<19"
diamond = ">=2.2.4,<3"

[tool.pixi.feature.identify.dependencies]
# For virus identification commands (marker-search, search-viruses)
mmseqs2 = ">=18.8cc5c,<19"
diamond = ">=2.2.4,<3"
# hmmer = ">=3.4,<4" # not needed, pyhmmer is used instead

[tool.pixi.feature.cluster.dependencies]
# For cluster command backends (blastn all-vs-all, mmseqs easy-search)
blast = ">=2.17.0,<3"
mmseqs2 = ">=18.8cc5c,<19"

[tool.pixi.feature.cluster.pypi-dependencies]
# Python ANI/clustering backends
pyskani = ">=0.2.0, <0.3"
pyfastani = ">=0.6.1, <0.7"
igraph = ">=1.0.0, <2"
leidenalg = ">=0.12.0, <0.13"

[tool.pixi.feature.misc.dependencies]
# For miscellaneous commands (fetch-sra, etc.)
aria2 = ">=1.37.0,<2"


[tool.pixi.feature.dev.dependencies]
# Development and testing tools. Many of these are only used in the build-data script.
uv = ">=0.11.29,<0.12"
ipython = ">=8.37.0,<9"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.3.0,<8"
aria2 = ">=1.37.0,<2"
google-cloud-sdk = ">=578.0.0,<579" # TODO: check if this is needed
blast = ">=2.17.0,<3"        
entrez-direct = ">=24.0,<25"
eutils = ">=0.6.1,<0.7"
taxonkit = ">=0.20.0,<0.21"
ca-certificates = ">=2026.7.22,<2027"
certifi = ">=2026.7.22,<2027"
openssl = ">=3.6.3,<4"
pytrimal = ">=0.8.5,<0.9"
t-coffee = ">=12.0.7fb8c2,<14"
hhsuite = ">=3.3.0,<4"

[tool.pixi.feature.dev.pypi-dependencies]
lets-plot = ">=4.11.0, <5"
itables = ">=2.9.0, <3"
fastexcel = ">=0.12,<1"
taxopy = ">=0.1.0, <0.2"

[tool.pixi.feature.docs.pypi-dependencies]
mkdocs-mermaid2-plugin = ">=1.2.3, <2"
mkdocstrings = ">=1.0.6, <2"
mkdocstrings-python = ">=2.0.5, <3"
zensical = ">=0.0.51, <0.0.52"

[tool.pixi.feature.py3.dependencies]
python = ">=3.10,<3.15"

[tool.pixi.environments]
# Minimal environment with just core Python dependencies
default = { features = ["py3"] }

# Complete environment with all dependencies (for full functionality)
complete = { features = [
    "py3",
    "reads",
    "assembly",
    "annotation-rna",
    "annotation-prot",
    "identify",
    "cluster",
    "misc",
] }

# Development environment
dev = { features = [
    "py3",
    "reads",
    "assembly",
    "annotation-rna",
    "annotation-prot",
    "identify",
    "cluster",
    "misc",
    "build",
    "format",
    "publish",
    "dev",
    "docs",
] }

# Specific command group environments for targeted installations
reads-only = { features = ["py3", "reads"] }
assembly-only = { features = ["py3", "assembly"] }
annotation-only = { features = ["py3", "annotation-rna", "annotation-prot"] }
annotation-rna-only = { features = ["py3", "annotation-rna"] }
annotation-prot-only = { features = ["py3", "annotation-prot"] }
identify-only = { features = ["py3", "identify"] }
cluster-only = { features = ["py3", "cluster"] }
cluster = { features = ["py3", "cluster"] }
misc-only = { features = ["py3", "misc"] }

# Common workflow combinations
full-annotation = { features = [
    "py3",
    "reads",
    "assembly",
    "annotation-rna",
    "annotation-prot",
    "identify",
] }

[tool.pixi.feature.format.tasks]
format = "ruff check --select I --fix src && ruff format src"

[tool.pixi.feature.publish.tasks]
publish-pypi = "twine upload dist/* --verbose"

[tool.pixi.feature.build.tasks]
build-pypi = "hatch version micro && hatch build --clean"

[tool.pixi.feature.dev.tasks]
test-import = "python -c 'import rolypoly; print(rolypoly.__version__)'"
test-cli = "pytest -q src/tests/test_cli_contracts.py"
bump = "bash src/setup/bump.sh"
commit-release = "bash src/setup/commit_release.sh"
publish-release = "bash src/setup/publish_release.sh"

[tool.pixi.feature.docs.tasks]
docs-serve = "zensical serve -f docs/mkdocs_zensical.yml"
docs-build = "zensical build -f docs/mkdocs_zensical.yml"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    ".pixi/",
    "tests",
]

line-length = 80
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
ignore = ["E501", "E402", "E401", "PLC0415", "E712", "F403", "E722", "F841"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
line-ending = "auto"
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-ra --basetemp=testing_folder/outputs/pytest_tmp"
log_file = "testing_folder/pytest.log"
log_file_level = "DEBUG"
filterwarnings = [
    "ignore:`use_rich_markup=` will be deprecated.*:PendingDeprecationWarning",
    "ignore:'BaseCommand' is deprecated and will be removed in Click 9.0.*:DeprecationWarning",
]
