site_name: RolyPoly Documentation
site_url: "https://urineri.github.io/rolypoly/"
repo_url: https://github.com/UriNeri/rolypoly
docs_dir: mkdocs_docs
theme:
  name: material
  logo: images/rp_pixel.png     # This safely keeps your custom PNG logo
  favicon: images/rp_pixel.png  # This safely keeps your custom PNG favicon
  icon:
    repo: material/github       # FIX: Uses the native GitHub SVG icon for the repo link
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - toc.follow
    - search.suggest
    - search.highlight

plugins:
    - search
    - mkdocstrings:
        handlers:
          python:
            paths: [src]
            options:
              show_source: false
              show_root_heading: true
              show_object_full_path: false
              show_category_heading: true
              show_if_no_docstring: true
              filters: ["!^_"]
              docstring_style: google
              docstring_section_style: table
              show_signature: true
              show_signature_annotations: true
              separate_signature: true
              line_length: 80
              merge_init_into_class: true
              show_bases: true
              show_submodules: true
              group_by_category: true
              heading_level: 2
              members_order: source
              extra:
                setup_commands:
                  - import sys
                  - from pathlib import Path
                  - sys.path.append(str(Path("src").resolve()))

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."] # Allows snippets to reference the repository root
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: python
          class: python
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Contributing: contribute.md
  - Configuration: configuration.md
  - Examples and Scientific background: examples.md
  - Resource Usage: resource_usage.md
  - Commands:
    - "get-data": commands/get_data.md
    - "version": commands/version.md
    - "roll": commands/roll.md
    - Read Processing:
      - "filter-reads": commands/filter_reads.md
      - "shrink-reads": commands/shrink_reads.md
      - "mask-dna": commands/mask_dna.md
    - Assembly:
      - "assemble": commands/assemble.md
      - "extend": commands/extend.md
      - "filter-contigs": commands/filter_contigs.md
    - Virus Search:
      - "nucleic-search": commands/nucleic_search.md
      - "marker-search": commands/marker_search.md
      - "rdrp-motif-search": commands/rdrp_motif_search.md
      - "mmtax": commands/mmtax.md
    - Annotation:
      - "annotate": commands/annotate.md
      - "annotate-rna": commands/annotate_rna.md
      - "annotate-prot": commands/annotate_prot.md
    - Binning:
      - "correlate": commands/correlate.md
      - "termini": commands/termini.md
      - "cluster": commands/cluster.md
      - "binit": commands/binit.md
    - Miscellaneous:
      - "fastx-calc": commands/fastx_calc.md
      - "fastx-stats": commands/fastx_stats.md
      - "fetch-sra": commands/fetch_sra.md
      - "rename-seqs": commands/rename_seqs.md
